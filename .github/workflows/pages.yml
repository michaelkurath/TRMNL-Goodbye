name: Deploy website to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "website/**"
      - "data/trmnl.json"
      - "assets/icon/goodbye-icon.svg"
      - "assets/exhibits/responsive-v2/*-standard-4x3.jpg"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Assemble website
        run: |
          mkdir -p _site/assets
          cp website/index.html website/styles.css website/app.js _site/
          cp data/trmnl.json _site/catalogue.json
          cp assets/icon/goodbye-icon.svg _site/assets/
          cp assets/exhibits/responsive-v2/*-standard-4x3.jpg _site/assets/
          touch _site/.nojekyll

      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
