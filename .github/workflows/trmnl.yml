name: TRMNL

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0"
      - name: Validate content data
        run: |
          node scripts/validate-data.js
          node scripts/validate-candidates.js
      - name: Install trmnlp
        run: gem install trmnl_preview
      - name: Lint plugin
        run: trmnlp lint
      - name: Use branch data for preview build
        run: |
          sed -i 's#https://raw.githubusercontent.com/michaelkurath/TRMNL-Goodbye/main/assets/exhibits#http://127.0.0.1:8765/assets/exhibits#' data/trmnl.json
          python3 -m http.server 8765 > /tmp/goodbye-preview-server.log 2>&1 &
          sed -i 's#https://raw.githubusercontent.com/michaelkurath/TRMNL-Goodbye/main/data/trmnl.json#http://127.0.0.1:8765/data/trmnl.json#' src/settings.yml
      - name: Build OG and X previews
        run: |
          mkdir -p _build_og
          mkdir -p _build_x
          docker pull trmnl/trmnlp
          docker run -d --name goodbye-trmnlp --network host --volume "$PWD:/plugin" trmnl/trmnlp serve --bind 0.0.0.0
          for view in full half_horizontal half_vertical quadrant; do
            curl --fail --retry 30 --retry-delay 1 --retry-connrefused "http://127.0.0.1:4567/render/${view}.html?screen_classes=screen--og%20screen--md%20screen--density-1x%20screen--1bit&width=800&height=480" -o "_build_og/${view}.html"
            curl --fail "http://127.0.0.1:4567/render/${view}.png?screen_classes=screen--og%20screen--md%20screen--density-1x%20screen--1bit&width=800&height=480&color_depth=1" -o "_build_og/${view}.png"
            curl --fail "http://127.0.0.1:4567/render/${view}.html?screen_classes=screen--v2%20screen--lg%20screen--density-2x%20screen--4bit&width=1040&height=780" -o "_build_x/${view}.html"
            curl --fail "http://127.0.0.1:4567/render/${view}.png?screen_classes=screen--v2%20screen--lg%20screen--density-2x%20screen--4bit&width=1040&height=780&color_depth=4" -o "_build_x/${view}.png"
          done
      - name: Render every live entry in every layout
        run: |
          cp data/trmnl.json /tmp/goodbye-all-items.json
          mkdir -p _build_matrix
          for entry_id in $(jq -r '.items[].id' /tmp/goodbye-all-items.json); do
            jq --arg entry_id "$entry_id" '.items |= map(select(.id == $entry_id))' /tmp/goodbye-all-items.json > /tmp/goodbye-single-item.json
            cp /tmp/goodbye-single-item.json data/trmnl.json
            docker rm --force goodbye-trmnlp > /dev/null
            docker run -d --name goodbye-trmnlp --network host --volume "$PWD:/plugin" trmnl/trmnlp serve --bind 0.0.0.0
            for view in full half_horizontal half_vertical quadrant; do
              curl --fail --retry 30 --retry-delay 1 --retry-connrefused --retry-all-errors "http://127.0.0.1:4567/render/${view}.png?screen_classes=screen--og%20screen--md%20screen--density-1x%20screen--1bit&width=800&height=480&color_depth=1" -o "_build_matrix/${entry_id}-og-${view}.png"
              curl --fail --retry 5 --retry-delay 1 --retry-all-errors "http://127.0.0.1:4567/render/${view}.png?screen_classes=screen--v2%20screen--lg%20screen--density-2x%20screen--4bit&width=1040&height=780&color_depth=4" -o "_build_matrix/${entry_id}-x-${view}.png"
            done
          done
          docker rm --force goodbye-trmnlp > /dev/null
          cp /tmp/goodbye-all-items.json data/trmnl.json
      - name: Upload previews
        uses: actions/upload-artifact@v4
        with:
          name: trmnl-previews
          path: |
            _build_og/*.html
            _build_og/*.png
            _build_x/*.html
            _build_x/*.png
            _build_matrix/*.png
