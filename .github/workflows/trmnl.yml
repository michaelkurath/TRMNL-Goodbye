name: TRMNL

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0"
      - name: Validate content data
        run: |
          node scripts/validate-data.js
          node scripts/validate-candidates.js
      - name: Install trmnlp
        run: gem install trmnl_preview
      - name: Lint plugin
        run: trmnlp lint
      - name: Use branch data for preview build
        run: |
          sed -i 's#https://raw.githubusercontent.com/michaelkurath/TRMNL-Goodbye/main/assets/exhibits#http://127.0.0.1:8765/assets/exhibits#' data/trmnl.json
          python3 -m http.server 8765 > /tmp/goodbye-preview-server.log 2>&1 &
          sed -i 's#https://raw.githubusercontent.com/michaelkurath/TRMNL-Goodbye/main/data/trmnl.json#http://127.0.0.1:8765/data/trmnl.json#' src/settings.yml
      - name: Build HTML previews
        run: trmnlp build
      - name: Build bitmap previews
        run: |
          docker run --rm --network host --volume "$PWD:/plugin" trmnl/trmnlp build --png --width 800 --height 480
          mkdir -p _build_og
          cp _build/* _build_og/
          docker run --rm --network host --volume "$PWD:/plugin" trmnl/trmnlp build --png --width 1872 --height 1404
          mkdir -p _build_x
          cp _build/* _build_x/
          sudo chmod -R a+r _build _build_og _build_x
      - name: Upload previews
        uses: actions/upload-artifact@v4
        with:
          name: trmnl-previews
          path: |
            _build_og/*.html
            _build_og/*.png
            _build_x/*.html
            _build_x/*.png
