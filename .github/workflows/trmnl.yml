name: TRMNL

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate-and-render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0"

      - uses: browser-actions/setup-firefox@v1

      - name: Install render dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes imagemagick
          gem install trmnl_preview

      - name: Validate data and rotation
        run: |
          node scripts/validate-data.js
          node scripts/validate-candidates.js
          node scripts/test-transform.js

      - name: Lint plugin
        run: trmnlp lint

      - name: Render TRMNL OG and X
        run: |
          trmnlp serve --bind 127.0.0.1 > /tmp/trmnlp.log 2>&1 &
          trmnlp_pid=$!
          trap 'kill "$trmnlp_pid" 2>/dev/null || true' EXIT

          for attempt in {1..30}; do
            if curl --silent --fail http://127.0.0.1:4567/full > /dev/null; then
              break
            fi
            if ! kill -0 "$trmnlp_pid" 2>/dev/null; then
              cat /tmp/trmnlp.log
              exit 1
            fi
            sleep 1
          done

          mkdir -p _build-og _build-x
          for view in full half_horizontal half_vertical quadrant; do
            curl --fail --silent --show-error \
              "http://127.0.0.1:4567/render/${view}.png?width=800&height=480" \
              --output "_build-og/${view}.png"
            curl --fail --silent --show-error \
              "http://127.0.0.1:4567/render/${view}.png?width=1872&height=1404" \
              --output "_build-x/${view}.png"
          done

      - name: Upload render previews
        uses: actions/upload-artifact@v6
        with:
          name: goodbye-render-previews
          path: |
            _build-og/*.png
            _build-x/*.png
