name: TRMNL

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate-and-render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0"

      - name: Install render dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes firefox imagemagick
          gem install trmnl_preview

      - name: Validate data and rotation
        run: |
          node scripts/validate-data.js
          node scripts/validate-candidates.js
          node scripts/test-transform.js

      - name: Lint plugin
        run: trmnlp lint

      - name: Render TRMNL OG
        run: |
          trmnlp build --png --width 800 --height 480
          mv _build _build-og

      - name: Render TRMNL X
        run: |
          trmnlp build --png --width 1872 --height 1404
          mv _build _build-x

      - name: Upload render previews
        uses: actions/upload-artifact@v6
        with:
          name: goodbye-render-previews
          path: |
            _build-og/*.png
            _build-x/*.png
